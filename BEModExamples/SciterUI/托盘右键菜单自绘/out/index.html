<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>白易 SciterUI · 托盘右键菜单自绘</title>
    <style>
        html, body {
            background: #ffffff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            flow: vertical;
            content-horizontal-align: center;
            cursor: default;
        }

        .container {
            flow: vertical;
            content-horizontal-align: center;
            content-vertical-align: middle;
            border-spacing: 12px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
            color: #83158f;
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #666666;
        }

        .tip {
            font-size: 12px;
            color: #888888;
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World</h1>
        <p>白易 SciterUI · 托盘右键菜单自绘示例</p>
        <div class="tip">💡 请右键点击屏幕右下角系统托盘图标，体验自绘菜单</div>
    </div>
</body>
</html>
