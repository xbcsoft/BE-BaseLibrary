<html>
<head>
  <meta charset='utf-8'>
  <style>
    html, body {
      width: *;
      height: *;
      margin: 0;
      padding: 0;
      background: #0d0e15;
    }

    body {
      color: #e2e2ec;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow-y: auto;
      position: relative;
    }

    .scroll-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(203, 166, 247, 0.4);
      background: linear-gradient(90deg, #b4befe, #cba6f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      color: #a6adc8;
      margin: 0;
    }

    .section-card {
      background: rgba(24, 24, 37, 0.6);
      border: 1px solid rgba(203, 166, 247, 0.15);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .section-card:hover {
      border-color: rgba(203, 166, 247, 0.4);
      box-shadow: 0 2px 8px rgba(203, 166, 247, 0.1);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #cba6f7;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-desc {
      font-size: 12px;
      color: #bac2de;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* 原生控件占位符 */
    .placeholder {
      width: *;
      height: 40px;
      background: rgba(17, 17, 27, 0.8);
      border: 1px dashed rgba(203, 166, 247, 0.3);
      border-radius: 8px;
      display: block;
    }

    .divider {
      height: 1px;
      margin: 30px 0;
    }
  </style>
</head>
<body>
  <div class="scroll-container">
    <header>
      <h1>Native Controls Integration</h1>
      <p class="subtitle">Sciter.JS 页面嵌入白易 Win32 原生控件演示</p>
    </header>

    <div class="section-card">
      <h3 class="section-title">1. 原生按钮控件 (Button)</h3>
      <p class="section-desc">以下是通过 Sciter DOM 占位符初始化的白易原生按钮控件。它保留了 Windows 操作系统的原生消息处理和白易内置的点击事件：</p>
      <div class="placeholder" id="btn-placeholder"></div>
    </div>

    <div class="section-card">
      <h3 class="section-title">2. 原生输入框控件 (Edit Box)</h3>
      <p class="section-desc">下面是一个原生的输入框。您可以直接在此进行文本输入，它将完美承载光标与系统输入法：</p>
      <div class="placeholder" id="edit-placeholder"></div>
    </div>

    <div class="section-card">
      <h3 class="section-title">3. 原生选择框控件 (Check Box)</h3>
      <p class="section-desc">这是一个原生的复选选择框控件，支持勾选状态改变：</p>
      <div class="placeholder" id="check-placeholder"></div>
    </div>

  </div>

</body>
</html>
